# CD (bonus item 7c): builds the programs, carves the sample photo with each method
# and delivers the result as one package.
#
#   pull request, push to main   the package is attached to the workflow run (artifact)
#   a version tag, e.g. v1.0     the same package is also published as a GitHub Release
#
# The tests still run in tests.yml on every push; this file only adds the delivery.
name: delivery

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write  # needed to publish the release

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libopencv-dev
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/tests
      - name: Carve the sample photo with each method
        run: |
          ./build/seamcarve images/broadway.jpg --width 600 --method dp --save-seams --out results/broadway_dp.png
          ./build/seamcarve images/broadway.jpg --width 600 --method greedy --save-seams --out results/broadway_greedy.png
          ./build/seamcarve images/broadway_small.jpg --width 90 --method graphcut --save-seams --out results/broadway_small_graphcut.png
      - name: Package the programs and the sample results
        run: |
          mkdir -p package/bin package/samples
          cp build/seamcarve build/tests build/evaluate package/bin/
          if [ -f build/seamcarve_viewer ]; then cp build/seamcarve_viewer package/bin/; fi
          cp results/*.png package/samples/
          cp README.md package/
          tar -czf seamcarve-ubuntu.tar.gz -C package .
      - uses: actions/upload-artifact@v7
        with:
          name: seamcarve-ubuntu
          path: seamcarve-ubuntu.tar.gz
          if-no-files-found: error
      - name: Publish a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" seamcarve-ubuntu.tar.gz
          --title "Seam carving $GITHUB_REF_NAME" --generate-notes
